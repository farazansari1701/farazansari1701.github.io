name: Build and publish blog
on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/portfolio.css"
      - "assets/portfolio-responsive.css"
      - "assets/site-menu.js"
      - "blog/assets/footer.js"
      - "package.json"
      - "blog/content/**"
      - "blog/topics/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/build-blogs.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/portfolio.css"
      - "assets/portfolio-responsive.css"
      - "assets/site-menu.js"
      - "blog/assets/footer.js"
      - "package.json"
      - "blog/content/**"
      - "blog/topics/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/build-blogs.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blog-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install "Pillow>=10,<13"
          npm ci
      - name: Build static articles and assets
        run: npm run build:blogs
      - name: Validate blog and homepage
        run: npm run check:blogs
      - name: Commit generated HTML and media
        if: github.event_name != 'pull_request'
        run: |
          git add -A -- .
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: publish approved blog content"
          git push origin HEAD:main
