name: Live browser and Lighthouse QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-qa.yml'
      - 'scripts/test-site-browser.cjs'
      - 'scripts/report-lighthouse.cjs'
      - 'assets/seo-*.css'
      - 'assets/portfolio.css'
      - 'assets/portfolio.js'
      - 'assets/measurement.js'
      - 'assets/analytics.js'
      - 'assets/project-consent.js'
      - 'blog/assets/blog.css'
      - 'scripts/sync-site-header.py'
      - 'assets/shared-header.css'
      - 'assets/portfolio-responsive.css'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-site-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.11.0 lighthouse@12.8.2
          npx playwright install --with-deps chromium webkit
      - name: Wait for the accessibility assets to be published
        run: |
          python3 scripts/sync-site-header.py
          node - <<'JS' > /tmp/expected-assets.txt
          const fs=require('fs'),crypto=require('crypto'),esbuild=require('esbuild');
          for (const [key,file] of [['PROJECTS','assets/seo-projects.css'],['PORTFOLIO','assets/portfolio.css'],['HEADER','assets/shared-header.css']]) {
            const output=esbuild.transformSync(fs.readFileSync(file,'utf8'),{loader:'css',minify:true,legalComments:'none',charset:'utf8'}).code;
            console.log(key+'='+crypto.createHash('sha256').update(output).digest('hex').slice(0,12));
          }
          JS
          source /tmp/expected-assets.txt
          echo "Waiting for deployed stylesheet versions: Projects=${PROJECTS}, Portfolio=${PORTFOLIO}, Header=${HEADER}"
          for attempt in $(seq 1 36); do
            curl -fsSL --max-time 15 "https://farazansari1701.com/?qa-check=${GITHUB_SHA}" -o /tmp/qa-home.html || true
            curl -fsSL --max-time 15 "https://farazansari1701.com/projects/?qa-check=${GITHUB_SHA}" -o /tmp/qa-projects.html || true
            if grep -Fq "portfolio.min.css?v=${PORTFOLIO}" /tmp/qa-home.html \
              && grep -Fq "shared-header.min.css?v=${HEADER}" /tmp/qa-home.html \
              && grep -Fq "seo-projects.min.css?v=${PROJECTS}" /tmp/qa-projects.html; then
              echo "Updated accessibility CSS is live."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for matching deployed assets."
          exit 1
      - name: Test live pages in Chromium and WebKit
        run: |
          node scripts/test-site-browser.cjs
      - name: Lighthouse mobile and desktop
        if: always()
        run: |
          mkdir -p audit-output
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npx lighthouse https://farazansari1701.com/ --output=json --output-path=audit-output/lighthouse-mobile.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet || true
          npx lighthouse https://farazansari1701.com/ --preset=desktop --output=json --output-path=audit-output/lighthouse-desktop.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet || true
          node scripts/report-lighthouse.cjs audit-output/lighthouse-mobile.json audit-output/lighthouse-desktop.json
      - name: Upload screenshots and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-audit
          path: audit-output/
          retention-days: 7
