<style>
:root{
  --paper:#F6F6F3; --ink:#1A1A1A; --cyan:#00AEEF; --magenta:#EC008C; --yellow:#FFE500;
  --bg:var(--paper); --fg:var(--ink); --sheet:#FFFFFF; --shade:#E2E2DC;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif; --gutter:clamp(20px,5vw,72px);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root{ --bg:#141414; --fg:#EDEDE9; --sheet:#EDEDE9; --shade:#BDBDB6; } }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
body{ background:var(--bg); color:var(--fg); font-family:var(--font); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--cyan); outline-offset:4px; }

.page{ min-height:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); align-items:center; gap:clamp(24px,5vw,80px); padding:clamp(28px,5vw,64px) var(--gutter); }
.top{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 18px); left:var(--gutter); display:flex; gap:10px; align-items:center; font-weight:700; font-size:15px; text-decoration:none; }
.top svg{ width:20px; height:20px; }

h1{ margin:0; font-size:clamp(64px,10.5vw,170px); line-height:.82; font-weight:880; letter-spacing:-.03em; font-variation-settings:"wdth" 125; }
.code{ display:block; margin-bottom:18px; font-size:15px; font-weight:700; color:color-mix(in srgb,var(--fg) 60%,transparent); }
.lead{ margin:clamp(22px,3vw,34px) 0 0; max-width:34ch; font-size:clamp(19px,1.6vw,23px); line-height:1.45; }
.actions{ display:flex; flex-wrap:wrap; gap:14px 26px; align-items:center; margin-top:clamp(26px,3.5vw,40px); }
.btn{ display:inline-flex; align-items:center; min-height:52px; padding:0 24px; background:var(--fg); color:var(--bg); font-weight:750; font-size:16px; text-decoration:none; border:0; border-radius:999px; cursor:pointer; transition:transform .2s; }
.btn:hover{ transform:translateY(-2px); }
.txt{ background:none; border:0; padding:12px 0; font:inherit; font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px; color:inherit; }
.txt:hover{ color:var(--cyan); }
.txt[disabled]:hover{ color:inherit; }
.txt[disabled]{ opacity:.45; cursor:default; text-decoration:none; }
.status{ min-height:1.5em; margin:16px 0 0; font-size:14px; color:color-mix(in srgb,var(--fg) 65%,transparent); }

/* ---------- the printer ---------- */
.printer{ width:100%; max-width:560px; justify-self:center; overflow:visible; }
.printer .body{ fill:var(--fg); }
.printer .tray{ fill:var(--shade); }
.printer .slot{ fill:var(--bg); }
.printer .vent{ stroke:var(--bg); stroke-width:3; stroke-linecap:round; }
.printer .display{ fill:var(--bg); }
.printer .dtext{ fill:var(--fg); font-family:var(--font); font-weight:800; font-size:15px; letter-spacing:.06em; font-variation-settings:"wdth" 80; }
.printer .led{ fill:var(--magenta); animation:blink 1s steps(2,end) infinite; }
.printer .btnr{ fill:var(--bg); }
.printer .f1{ fill:var(--sheet); } .printer .f2{ fill:var(--shade); }
.printer .edge{ stroke:var(--bg); stroke-width:3; stroke-linejoin:round; paint-order:stroke; }
.printer .crease{ fill:none; stroke:color-mix(in srgb,var(--fg) 22%,transparent); stroke-width:1.2; }
.printer .smear{ fill:none; stroke-linecap:round; stroke-width:5; opacity:.55; mix-blend-mode:multiply; }
.printer .print text{ font-family:var(--font); font-weight:900; font-size:58px; font-variation-settings:"wdth" 120; mix-blend-mode:multiply; }
@media (prefers-color-scheme: dark){ .printer .print text, .printer .smear{ mix-blend-mode:normal; opacity:.85; } }
.printer .fresh{ fill:var(--sheet); }
.printer .fresh-line{ stroke:color-mix(in srgb,var(--fg) 28%,transparent); stroke-width:4; stroke-linecap:round; }
#jam{ transform-box:view-box; transform-origin:200px 196px; transition:transform .9s cubic-bezier(.55,0,.75,.3), opacity .5s .45s; }
.cleared #jam{ transform:translate(-30px,260px) rotate(-38deg) scale(.7); opacity:0; }
#fresh{ transform:translateY(-70px); transition:transform 1.4s cubic-bezier(.2,.7,.1,1) 1s; }
.cleared #fresh{ transform:translateY(0); }
.cleared .led{ fill:var(--cyan); animation:none; }
#shake{ transform-box:view-box; transform-origin:200px 300px; }
.cleared #shake{ animation:shudder .35s 1s 3; }
@keyframes blink{ 50%{ opacity:.15; } }
@keyframes shudder{ 25%{ transform:translateX(-2px) } 75%{ transform:translateX(2px) } }

@media (max-width:820px){
  .page{ grid-template-columns:minmax(0,1fr); align-content:center; padding-top:calc(env(safe-area-inset-top,0px) + 70px); }
  .printer{ grid-row:1; max-width:420px; }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition-duration:.001ms !important; transition-delay:0s !important; }
}

      <rect class="btnr" x="300" y="168" width="28" height="12" rx="6"/>
      <!-- output slot -->
      <rect class="slot" x="70" y="200" width="260" height="14" rx="3"/>
      <!-- a clean sheet that prints once the jam is cleared -->
      <svg x="86" y="208" width="228" height="190" overflow="hidden">
        <g id="fresh">
          <rect class="fresh" x="0" y="-130" width="228" height="190"/>
          <path class="fresh-line" d="M26 6h120M26 22h170M26 38h90"/>

      <!-- the jammed sheet, crumpled as it leaves the slot -->

        <path class="f1 edge" d="M84 206 316 206 324 238 300 262 318 300 268 330 286 362 214 380 196 352 150 384 92 360 108 324 70 298 96 262 76 236Z"/>
        <path class="f2" d="M84 206 196 214 150 250 96 262 76 236Z"/>
        <path class="f2" d="M300 262 214 296 268 330 318 300Z"/>
        <path class="f2" d="M108 324 150 384 196 352 160 330Z"/>
        <path class="f2" d="M196 214 316 206 324 238Z"/>
        <path class="crease" d="M196 214 150 250 214 296 268 330M150 250 96 262M214 296 160 330 108 324M160 330 196 352M300 262 214 296M196 214 324 238"/>
        <g class="print" transform="translate(118 330) rotate(-9) skewX(-8)">
          <text x="3" y="0" fill="var(--cyan)">404</text>

        </g>
        <path class="smear" stroke="var(--cyan)" d="M112 236c40-6 90-4 140 4"/>
        <path class="smear" stroke="var(--magenta)" d="M124 248c30-4 70-2 104 2"/>
      </g>
    </g>
  </svg>
</main>

<script>
(() => {
  const btn = document.getElementById('clear'), page = document.getElementById('page');
  const status = document.getElementById('status'), d = document.getElementById('dtext');
  btn.addEventListener('click', () => {
    page.classList.add('cleared'); btn.disabled = true;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => { d.textContent = 'READY'; status.textContent = 'Jam cleared. The home page is one click away.'; }, reduce ? 0 : 1300);
  });
})();
</script>
